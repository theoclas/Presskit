# Cambio de dominio (docs/05-cambio-dns.md). Se agrega al VPS ANTES de mover el DNS: mientras
# el dominio apunte a Hostinger no hace nada.
#
#   sudo cp deploy/host-nginx/apex.conf /etc/nginx/sites-available/fersua-booking-apex.conf
#   sudo ln -s /etc/nginx/sites-available/fersua-booking-apex.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   # con el A del dominio ya en 177.7.40.130 y www como CNAME:
#   sudo certbot --nginx -d fersuastudio.com -d www.fersuastudio.com --redirect --hsts
#
# Después, en el bloque 443 de booking.fersuastudio.com (el que creó certbot), cambiar el
# `location / { include ... }` por:
#
#   location / { return 301 https://fersuastudio.com$request_uri; }

server {
    listen 80;
    listen [::]:80;
    server_name fersuastudio.com www.fersuastudio.com;

    server_tokens off;
    client_max_body_size 12m;
    client_body_timeout 30s;

    # Formato sin query string: conf.d/fersua-booking-log.conf (va primero en /etc/nginx/conf.d/).
    access_log /var/log/nginx/fersua-booking.access.log fersua_booking;
    error_log  /var/log/nginx/fersua-booking.error.log warn;

    # www -> dominio principal (una sola URL canónica).
    if ($host = www.fersuastudio.com) {
        return 301 https://fersuastudio.com$request_uri;
    }

    location / {
        include snippets/fersua-booking-proxy.conf;
    }
}

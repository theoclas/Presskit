# /etc/nginx/conf.d/fersua-booking-log.conf en el VPS (contexto http, se incluye una sola vez).
# Formato del log de acceso de Fersua Booking SIN la query string: las búsquedas del admin
# llevan correos y teléfonos (?q=) y la vista previa firmada lleva una capacidad de lectura
# (?exp=&sig=). Ley 1581: nada de datos personales en los logs.
#
#   sudo cp deploy/host-nginx/conf.d/fersua-booking-log.conf /etc/nginx/conf.d/
#   (y en cada access_log de fersua-booking*.conf, agregar " fersua_booking" al final)
#   sudo nginx -t && sudo systemctl reload nginx

map $request_uri $fersua_booking_path {
    "~^(?<fersua_booking_path_only>[^?]*)" $fersua_booking_path_only;
    default "-";
}

log_format fersua_booking '$remote_addr - [$time_local] "$request_method $fersua_booking_path $server_protocol" '
                          '$status $body_bytes_sent $request_time "$http_user_agent"';

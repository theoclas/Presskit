# Va en /etc/nginx/snippets/ del VPS. Proxy del nginx del host hacia el edge (127.0.0.1:8090).
# X-Real-IP y X-Forwarded-For se SOBRESCRIBEN con la IP de la conexión: lo que mande el
# cliente en esas cabeceras se ignora. El edge solo confía en X-Real-IP.

proxy_pass http://127.0.0.1:8090;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

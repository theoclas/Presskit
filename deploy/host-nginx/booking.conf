# /etc/nginx/sites-available/fersua-booking.conf en el VPS (beta: booking.fersuastudio.com).
# Solo HTTP: certbot --nginx agrega el bloque 443 y la redirección 80 -> 443.
#
#   sudo cp deploy/host-nginx/conf.d/fersua-booking-log.conf /etc/nginx/conf.d/
#   sudo cp deploy/host-nginx/snippets/fersua-booking-proxy.conf /etc/nginx/snippets/
#   sudo cp deploy/host-nginx/booking.conf /etc/nginx/sites-available/fersua-booking.conf
#   sudo ln -s /etc/nginx/sites-available/fersua-booking.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d booking.fersuastudio.com --redirect --hsts
#
# Recomendado (una vez, si el VPS no lo tiene): un default_server que responda 444 a todo
# Host desconocido, para que nadie llegue a esta app (ni a otra) pidiendo la IP a secas:
#
#   server { listen 80 default_server; listen [::]:80 default_server; server_name _; return 444; }
#   (y en 443: listen 443 ssl default_server; ssl_reject_handshake on; return 444;)

server {
    listen 80;
    # Deja esta línea solo si los demás vhosts del VPS ya escuchan en IPv6.
    listen [::]:80;
    server_name booking.fersuastudio.com;

    server_tokens off;
    # Un poco más que el límite de subida del api (10 MB) para que el 413 lo dé el api en JSON.
    client_max_body_size 12m;
    client_body_timeout 30s;

    # Formato sin query string: conf.d/fersua-booking-log.conf (va primero en /etc/nginx/conf.d/).
    access_log /var/log/nginx/fersua-booking.access.log fersua_booking;
    error_log  /var/log/nginx/fersua-booking.error.log warn;

    # Beta: fuera de los buscadores. Se quita en el cambio al dominio principal.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        include snippets/fersua-booking-proxy.conf;
    }
}

# Server único del edge. Detrás del nginx del host (TLS) en 127.0.0.1:8090 -> 8080.
#
# Orden de evaluación en nginx: primero los `=` exactos, luego el prefijo más largo, luego
# las regex en el orden en que aparecen (la primera que coincide gana, salvo prefijos ^~).
#
# Las regex de /api/ deben coincidir con API_ROUTES de packages/shared/src/routes.ts:
# lo comprueba scripts/ci/check-compose.mjs en la CI.

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;

  # Redirecciones siempre relativas. Sin esto nginx arma http://<host>:8080/..., y el 8080
  # del VPS es otra app publicada.
  absolute_redirect off;
  port_in_redirect off;
  server_tokens off;

  client_max_body_size 1m;
  limit_conn perip 30;

  # ------------------------------------------------------------------ salud y archivos ocultos
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /.well-known/security.txt {
    include /etc/nginx/snippets/security-headers.conf;
    default_type text/plain;
    try_files $uri =404;
  }

  # .env, .git, etc. Nunca se sirven (404 para no confirmar que existen).
  location ~ /\. {
    access_log off;
    return 404;
  }

  # ------------------------------------------------------------------ URLs del sitio viejo
  # /Eventos/MacflyMikeBran/14%20Nov.html, /Eventos/MacflyMikeBran/IMG/... (cualquier mayúscula)
  location ~* ^/eventos/macflymikebran(/.*)?$ {
    return 301 /macfly-mike-bran#fechas;
  }

  location ~* ^/default\.php$ {
    return 301 /;
  }

  # ------------------------------------------------------------------ api
  # /api/health/ready hace un SELECT por llamada: es solo para diagnóstico interno (desde el
  # host: docker compose exec). Hacia afuera no existe. /api/health sí queda público (deploy.sh).
  location ~* ^/api/health/ready/?$ {
    access_log off;
    return 404;
  }

  # Límites gruesos del edge. Los errores 429 y 413 salen en JSON, como los del api.
  # ~* y /? final: Express no distingue mayúsculas ni la barra final, así que /api/AUTH/login/
  # también llega al login y no debe escaparse al límite general de /api/.
  # mfa, step-up y change-password también prueban una contraseña o un código: van en la
  # misma zona. Usa proxy-api.conf (con cookies): mfa y change-password fijan la de sesión.
  # M3: register fija la cookie de sesión; verify-email (token del correo) y
  # resend-verification (envía correo) también van aquí.
  location ~* ^/api/auth/(login|mfa|step-up|change-password|register|forgot-password|reset-password|verify-email|resend-verification)/?$ {
    client_max_body_size 16k;
    limit_req zone=auth burst=5 nodelay;
    error_page 429 = @rate_limited_json;
    error_page 413 = @too_large_json;
    include /etc/nginx/snippets/proxy-api.conf;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location ~* ^/api/public/djs/[a-z0-9-]+/booking-requests/?$ {
    client_max_body_size 64k;
    limit_req zone=forms burst=3 nodelay;
    error_page 429 = @rate_limited_json;
    error_page 413 = @too_large_json;
    include /etc/nginx/snippets/proxy-api-public.conf;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location ~* ^/api/public/tickets/?$ {
    client_max_body_size 64k;
    limit_req zone=tickets burst=3 nodelay;
    error_page 429 = @rate_limited_json;
    error_page 413 = @too_large_json;
    include /etc/nginx/snippets/proxy-api-public.conf;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Lecturas públicas con microcaché (M4): lista y ficha de DJs, y géneros. booking-token (un
  # token por visita), booking-requests y tickets NO coinciden con esta regex: siguen en sus
  # locations, sin caché. Sensible a mayúsculas a propósito: /API/... no llega a la caché.
  location ~ "^/api/public/(?:djs(?:/[A-Za-z0-9-]{1,64})?|genres)/?$" {
    client_max_body_size 64k;
    limit_req zone=api burst=40 nodelay;
    error_page 429 = @rate_limited_json;
    error_page 413 = @too_large_json;
    # Al api le llega la URI normalizada, la misma de la clave de la caché (microcache.conf). El
    # ? final descarta la query: estas rutas no la leen, y un ?x=<azar> por petición saltaría la
    # caché y llegaría a la BD cada vez.
    rewrite ^ $uri? break;
    include /etc/nginx/snippets/proxy-api-public.conf;
    include /etc/nginx/snippets/microcache.conf;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Rutas públicas: sin cookies de ida ni de vuelta.
  location /api/public/ {
    client_max_body_size 64k;
    limit_req zone=api burst=40 nodelay;
    error_page 429 = @rate_limited_json;
    error_page 413 = @too_large_json;
    include /etc/nginx/snippets/proxy-api-public.conf;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Subida de imágenes (M2, docs/api-m2.md: POST .../media, 10 MB). Es la única ruta con
  # cuerpo grande: 11m para que el api responda su propio 413 en JSON.
  location ~* ^/api/(me/profile|admin/profiles/[A-Za-z0-9_-]+)/media/?$ {
    client_max_body_size 11m;
    # El nginx del host ya guardó el cuerpo completo; aquí se pasa sin tocar el tmpfs.
    proxy_request_buffering off;
    limit_req zone=api burst=10 nodelay;
    # Un limit_conn propio reemplaza al del server: se repite perip para que siga contando.
    # Pasar el tope da 429 (limit_conn_status) en JSON, como los demás límites.
    limit_conn perip 30;
    limit_conn uploads 3;
    error_page 429 = @rate_limited_json;
    error_page 413 = @too_large_json;
    include /etc/nginx/snippets/proxy-api.conf;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location /api/ {
    # El resto del api recibe JSON pequeño (el api corta en 100 KB): un cuerpo grande se
    # rechaza aquí, antes de llegar a Node.
    client_max_body_size 128k;
    limit_req zone=api burst=40 nodelay;
    error_page 429 = @rate_limited_json;
    error_page 413 = @too_large_json;
    include /etc/nginx/snippets/proxy-api.conf;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location = /sitemap.xml {
    limit_req zone=pages burst=20 nodelay;
    rewrite ^ /api/public/sitemap.xml? break;
    include /etc/nginx/snippets/proxy-api-public.conf;
    include /etc/nginx/snippets/microcache.conf;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location = /robots.txt {
    limit_req zone=pages burst=20 nodelay;
    rewrite ^ /api/public/robots.txt? break;
    include /etc/nginx/snippets/proxy-api-public.conf;
    include /etc/nginx/snippets/microcache.conf;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # ------------------------------------------------------------------ medios subidos
  # Solo /srv/media (la parte public/ del volumen, montada en solo lectura) y solo webp/jpg.
  # URL: /media/<profileId>/<key>/<ancho>.webp  o  /media/<profileId>/<key>/og.jpg
  location ~ "^/media/[A-Za-z0-9_-]{1,64}/[A-Za-z0-9_-]{1,64}/(?:[0-9]{1,5}\.webp|og\.jpg)$" {
    root /srv;
    include /etc/nginx/snippets/media-headers.conf;
    try_files $uri =404;
  }

  location /media/ {
    return 404;
  }

  # ------------------------------------------------------------------ SPA compilada
  # Archivos de Vite con hash en el nombre: caché de un año.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Destino de los try_files de la SPA: nunca en caché, para que un despliegue se vea al instante.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # ------------------------------------------------------------------ páginas con head del api
  # / y /<segmento> los arma el api (title, OG, canonical, JSON-LD) sobre el index.html.
  # Microcaché de 10 s (M4): un cambio del DJ tarda hasta 10 s en verse. Si el api no responde,
  # se sirve la última copia guardada y, si no hay, la SPA sola (@spa).
  location = / {
    limit_req zone=pages burst=60 nodelay;
    error_page 429 = @rate_limited_page;
    rewrite ^ /api/public/shell?path=/? break;
    include /etc/nginx/snippets/proxy-api-public.conf;
    include /etc/nginx/snippets/microcache.conf;
    include /etc/nginx/snippets/security-headers.conf;
    error_page 502 503 504 = @spa;
  }

  # Un solo segmento: /macfly-mike-bran, /MacflyMikebran.html, /login... Los archivos que
  # existen en la raíz (favicon.ico, manifest) se sirven tal cual; lo demás va al shell,
  # que responde 200, 301 relativo (mayúsculas, .html, slug viejo) o 404 con noindex.
  location ~ "^/[A-Za-z0-9][A-Za-z0-9._-]{0,64}/?$" {
    limit_req zone=pages burst=60 nodelay;
    error_page 429 = @rate_limited_page;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri @shell;
  }

  location @shell {
    # El ? final descarta la query original (fbclid, utm_...): el api solo recibe path, y la
    # clave de la caché tampoco se multiplica con cada ?fbclid= distinto.
    rewrite ^ /api/public/shell?path=$uri? break;
    include /etc/nginx/snippets/proxy-api-public.conf;
    include /etc/nginx/snippets/microcache.conf;
    include /etc/nginx/snippets/security-headers.conf;
    error_page 502 503 504 = @spa;
  }

  # Rutas de varios segmentos de la SPA (/panel/..., /admin/...) y archivos de la raíz.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }

  location @spa {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =503;
  }

  # ------------------------------------------------------------------ errores propios del edge
  location @rate_limited_json {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Retry-After "60" always;
    return 429 '{"statusCode":429,"code":"RATE_LIMITED","message":"Demasiadas solicitudes. Intenta de nuevo en unos minutos."}';
  }

  location @too_large_json {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    return 413 '{"statusCode":413,"code":"PAYLOAD_TOO_LARGE","message":"Lo que enviaste es demasiado grande."}';
  }

  location @rate_limited_page {
    default_type text/plain;
    charset utf-8;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Retry-After "30" always;
    return 429 "Demasiadas solicitudes. Espera unos segundos y vuelve a intentar.\n";
  }
}

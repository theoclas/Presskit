# nginx del contenedor edge (nginx-unprivileged: uid 101, sistema de archivos de solo lectura).
# Todo lo que nginx escribe va a /tmp, que en compose es un tmpfs.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 30s;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  proxy_max_temp_file_size 0;

  # IP real del visitante. Solo se cree la cabecera X-Real-IP si la conexión viene del
  # gateway de la red edge (172.30.90.1), que es por donde entra el puerto publicado en
  # 127.0.0.1:8090 desde el nginx del host. Nadie más puede fijar su propia IP.
  set_real_ip_from 172.30.90.1;
  real_ip_header X-Real-IP;
  real_ip_recursive off;

  # Sin query string: las búsquedas del admin llevan correos y teléfonos (?q=) y la vista
  # previa firmada lleva una capacidad de lectura (?exp=&sig=). $request_uri es la URL original
  # (antes de los rewrite), así que el log sigue mostrando la página que se pidió.
  map $request_uri $request_path {
    "~^(?<req_path>[^?]*)" $req_path;
    default "-";
  }
  log_format main '$remote_addr "$request_method $request_path $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent" rid=$request_id';
  access_log /dev/stdout main;

  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml application/manifest+json;

  # Clave de los límites: la IPv4 completa, o el /64 de una IPv6. Un cliente IPv6 controla
  # todo su /64 y, con la dirección completa, estrenaría un balde nuevo con cada dirección.
  # nginx escribe las IPv6 comprimidas (RFC 5952: una racha de 2+ grupos en cero pasa a "::"):
  # - 4 primeros grupos escritos → esos 4 son el /64;
  # - "::" dentro de los 4 primeros (p. ej. 2001:db8:1::5:6:7 = 2001:db8:1:0:0:5:6:7) → lo
  #   anterior al "::" (1 a 4 grupos), y el resto del /64 es cero. Esa clave puede juntar un
  #   poco más que un /64, nunca menos;
  # - IPv4 o "::1" → la dirección completa.
  # Las regex se prueban en orden. El control fino sigue siendo el throttler del api, que ya
  # agrupa por /64.
  map $remote_addr $rl_key {
    "~^(?<v6net>[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}):" $v6net;
    "~^(?<v6pre>[0-9a-fA-F]{1,4}(?::[0-9a-fA-F]{1,4}){0,3})::" $v6pre;
    default $binary_remote_addr;
  }

  # Límites gruesos contra inundaciones. Los límites finos (por usuario, por perfil) los
  # pone el api. Holgados porque en Colombia muchos móviles salen por la misma IP (CGNAT).
  limit_req_zone $rl_key zone=auth:10m rate=10r/m;
  limit_req_zone $rl_key zone=forms:10m rate=6r/m;
  limit_req_zone $rl_key zone=tickets:10m rate=6r/m;
  limit_req_zone $rl_key zone=api:10m rate=10r/s;
  limit_req_zone $rl_key zone=pages:10m rate=20r/s;
  limit_conn_zone $rl_key zone=perip:10m;
  # Subidas de fotos simultáneas por IP: la web sube de a 2 y el api tiene 3 cupos en total.
  limit_conn_zone $rl_key zone=uploads:1m;
  limit_req_status 429;
  limit_conn_status 429;

  # DNS interno de Docker. Con `resolve`, nginx sigue al api aunque su contenedor cambie de IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  upstream api_upstream {
    zone api_upstream 64k;
    server api:3000 resolve;
    keepalive 8;
  }

  include /etc/nginx/conf.d/*.conf;
}

# Proxy hacia el api. La IP real ya la resolvió real_ip (nginx.conf): se reenvía y
# X-Forwarded-For se SOBRESCRIBE con ella (nunca se encadena lo que mande el cliente).

proxy_pass http://api_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Request-Id $request_id;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
# Sin proxy_intercept_errors: la página 404 del api (con noindex) debe llegar al navegador.

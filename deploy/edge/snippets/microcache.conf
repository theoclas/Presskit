# Microcaché del edge (M4). Una ráfaga de visitas a /<slug> o a la lista de DJs llega al api
# una vez cada 10 s en vez de una vez por visita (1 vCPU, cada shell consulta la BD).
#
# Solo va en locations de lectura pública SIN cookies (proxy-api-public.conf):
#   /, /<slug> (@shell), /api/public/djs, /api/public/djs/<slug>, /api/public/genres,
#   /sitemap.xml y /robots.txt.
# NUNCA en booking-token (un token por visita), booking-requests, tickets, /api/auth, /api/me
# ni /api/admin. scripts/ci/check-compose.mjs lo revisa.
#
# El location que lo incluye debe tener un `rewrite ... break`: así el api recibe exactamente
# la URI de la clave ($uri normalizada). Sin eso nginx le pasa la URI cruda (//api/public/djs,
# /api/public/%64js), el api puede responder otra cosa (404) y esa respuesta quedaría guardada
# bajo la URL buena: envenenamiento de la caché.
#
# Mismas cabeceras que el location (add_header se suma a las de security-headers.conf porque
# están en el mismo nivel). X-Cache-Status: MISS, HIT, EXPIRED, UPDATING, STALE o BYPASS.

proxy_cache micro;
proxy_cache_key "$edge_scheme://$host$uri$is_args$args";
proxy_cache_valid 200 301 10s;
proxy_cache_valid 404 5s;
# Si 50 personas abren la misma página a la vez, al api le llega una sola petición.
proxy_cache_lock on;
# Mientras se renueva, o si el api está caído o reiniciando (deploy), se sirve la última copia.
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;

# El shell manda "no-cache" y las lecturas públicas "max-age=30" o "300": el edge usa sus propios
# tiempos (10 s). Esas cabeceras siguen llegando igual al navegador. X-Accel-Expires se respeta:
# es la forma en que el api puede pedir "no guardes esto" (X-Accel-Expires: 0).
proxy_ignore_headers Cache-Control Expires;

# Nunca desde la caché ni hacia ella: peticiones con Authorization y respuestas que fijan una
# cookie o que el api marca no-store/private ($edge_upstream_nostore, en nginx.conf).
proxy_cache_bypass $http_authorization;
proxy_no_cache $http_authorization $upstream_http_set_cookie $edge_upstream_nostore;

add_header X-Cache-Status $upstream_cache_status always;
